# macOS builds, on the GitHub mirror only (Forgejo reads .forgejo/workflows
# and ignores this folder). Each v* tag the mirror pushes, or a manual run,
# builds HFPredict.app for Apple silicon and for Intel as .dmg files, kept as
# the run's artifacts; they are attached to the Forgejo release by hand
# (docs/releasing.md, "macOS").
name: macos
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)" = "${GITHUB_REF_NAME}"
      - name: Build
        run: packaging/macos/build.sh
      - name: Checksum
        run: cd dist && shasum -a 256 *.dmg | tee "HFPredict-macos-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: HFPredict-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
