# Windows builds, on the GitHub mirror only (Forgejo reads .forgejo/workflows
# and ignores this folder). Each v* tag the mirror pushes, or a manual run,
# builds HFPredict-<version>-windows-<arch>.zip for x64 and for ARM64 with
# packaging/windows/build.sh in MSYS2, natively on each. Forgejo's release
# job collects the zips (tools/fetch-github-builds.sh; docs/releasing.md,
# "Windows and macOS").
name: windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            msystem: CLANG64
            arch: x86_64
          - runner: windows-11-arm
            msystem: CLANGARM64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The scripts and the engine patch must keep their LF line endings.
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: zip patch curl
          pacboy: >-
            clang:p lld:p llvm:p pkgconf:p
            gtk4:p libadwaita:p librsvg:p adwaita-icon-theme:p hicolor-icon-theme:p
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)" = "${GITHUB_REF_NAME}"
      - name: Build
        run: packaging/windows/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: HFPredict-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
