# The Windows builds, on the GitHub mirror only (Forgejo reads
# .forgejo/workflows and ignores this folder). Each v* tag the mirror pushes,
# or a manual run, builds HFPredict-<version>-windows-<arch>-setup.exe with
# packaging/windows/build.sh in MSYS2, natively: x64 on an x64 runner
# (CLANG64), ARM64 on an ARM64 one (CLANGARM64). MSYS2's GTK is a stable
# release and the one GTK itself tests on Windows; Fedora's MinGW GTK (the
# local cross-build) was a development release whose x64 installer crashed
# at start-up on Windows 11 24H2 (heap corruption). Forgejo's release job
# collects these (tools/fetch-github-builds.sh; docs/releasing.md, "Windows
# and macOS").
name: windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            msystem: CLANG64
            arch: x86_64
          - runner: windows-11-arm
            msystem: CLANGARM64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The scripts and the engine patch must keep their LF line endings.
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # NSIS from MINGW64: x86 code (under Windows' emulation on ARM64).
          install: patch curl mingw-w64-x86_64-nsis
          pacboy: >-
            clang:p lld:p llvm:p pkgconf:p
            gtk4:p libadwaita:p librsvg:p adwaita-icon-theme:p hicolor-icon-theme:p
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)" = "${GITHUB_REF_NAME}"
      - name: Build
        run: packaging/windows/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: HFPredict-windows-${{ matrix.arch }}
          path: dist/*-setup.exe
          if-no-files-found: error
