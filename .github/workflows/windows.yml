# The Windows on ARM build, on the GitHub mirror only (Forgejo reads
# .forgejo/workflows and ignores this folder). Each v* tag the mirror pushes,
# or a manual run, builds HFPredict-<version>-windows-arm64.zip with
# packaging/windows/build.sh in MSYS2, natively on an ARM64 runner: no Linux
# distribution packages GTK for Windows on ARM to cross-build with. The x64
# zip is cross-built on Forgejo. Forgejo's release job collects this one
# (tools/fetch-github-builds.sh; docs/releasing.md, "Windows and macOS").
name: windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The scripts and the engine patch must keep their LF line endings.
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: zip patch curl
          pacboy: >-
            clang:p lld:p llvm:p pkgconf:p
            gtk4:p libadwaita:p librsvg:p adwaita-icon-theme:p hicolor-icon-theme:p
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)" = "${GITHUB_REF_NAME}"
      - name: Build
        run: packaging/windows/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: HFPredict-windows-arm64
          path: dist/*.zip
          if-no-files-found: error
