[package]
name = "hfpredict-ffi"
description = "HFPredict's core as a shared library for Android (UniFFI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
# Generates the Kotlin bindings from the built library (android/build.sh).
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
hfpredict-core = { path = "../core", features = ["ffi"] }
uniffi.workspace = true
