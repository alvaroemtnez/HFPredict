# Builds and publishes a release when a v* tag is pushed: signed APKs and the
# Accrescent APK set, the Flatpak bundle and the AppImage for x86_64 and arm64,
# the macOS and Windows builds the GitHub mirror makes (.github/workflows),
# SHA256SUMS (and its signature), with the CHANGELOG.md entry as the notes, on Forgejo and on the GitHub mirror.
# Secrets and runner set-up: docs/releasing.md.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: docker
    container:
      image: docker.io/library/debian:trixie
    steps:
      - name: System packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git curl ca-certificates nodejs unzip build-essential python3
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Tag matches the version
        run: test "v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)" = "${GITHUB_REF_NAME}"
      - name: Release APKs
        env:
          HFPREDICT_KEYSTORE_B64: ${{ secrets.HFPREDICT_KEYSTORE_B64 }}
          HFPREDICT_KEYSTORE_PASS: ${{ secrets.HFPREDICT_KEYSTORE_PASS }}
          HFPREDICT_KEY_ALIAS: ${{ secrets.HFPREDICT_KEY_ALIAS }}
          HFPREDICT_KEY_PASS: ${{ secrets.HFPREDICT_KEY_PASS }}
        run: |
          if [ -n "$HFPREDICT_KEYSTORE_B64" ]; then
            echo "$HFPREDICT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export HFPREDICT_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          android/build.sh release
          # The APK set for Accrescent, signed only: the Rust core is already
          # built, so this costs the app bundle and bundletool.
          [ -n "${HFPREDICT_KEYSTORE:-}" ] && android/build.sh accrescent
          rm -f "$RUNNER_TEMP/release.keystore"
          mkdir -p out && cp android/dist/HFPredict-*.apk out/
          cp android/dist/HFPredict-*.apks out/ 2>/dev/null || true
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: android
          path: out/

  flatpak:
    runs-on: docker
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # flatpak-builder sandboxes each step with bubblewrap.
      options: --privileged
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: FLATPAK_IN_CONTAINER=1 packaging/flatpak/build.sh
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak

  appimage:
    runs-on: docker
    container:
      image: docker.io/library/debian:trixie
    steps:
      - name: System packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git curl ca-certificates nodejs build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev librsvg2-common adwaita-icon-theme file python3 appstream
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: IN_CONTAINER=1 CARGO_TARGET_DIR=target packaging/appimage/build.sh
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  # arm64 builds, emulated on the x86 runner (docs/releasing.md, "ARM
  # builds"). This job registers QEMU for arm64 in the runner host's kernel
  # (binfmt_misc is one per kernel, so a privileged container can do it); the
  # "F" flag loads the interpreter now, so containers without QEMU in them,
  # and flatpak-builder's sandbox, can run arm64 programs. It lasts until the
  # host reboots, and every release checks again.
  qemu:
    runs-on: docker
    container:
      image: docker.io/library/debian:trixie
      options: --privileged
    steps:
      - name: Register QEMU for arm64
        run: |
          B=/proc/sys/fs/binfmt_misc
          [ -e "$B/register" ] || mount -t binfmt_misc binfmt_misc "$B"
          if [ -e "$B/qemu-aarch64" ] && grep -q '^flags: .*F' "$B/qemu-aarch64"; then
            echo "already registered:"; cat "$B/qemu-aarch64"; exit 0
          fi
          [ -e "$B/qemu-aarch64" ] && echo -1 > "$B/qemu-aarch64"
          apt-get update -q
          apt-get install -y -q --no-install-recommends qemu-user-static || apt-get install -y -q --no-install-recommends qemu-user
          Q=$(command -v qemu-aarch64-static || command -v qemu-aarch64)
          Q=$(readlink -f "$Q")
          # Must be static: with "F" it runs inside containers that lack its
          # libraries. (ldd exits 0 on a static-PIE binary, so read what it says.)
          ldd "$Q" 2>&1 | grep -qE 'not a dynamic executable|statically linked' || { ldd "$Q"; echo "$Q is not static"; exit 1; }
          # Magic and mask of an aarch64 ELF executable, as QEMU's qemu-binfmt-conf.sh has them.
          printf '%s' ":qemu-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:$Q:FPC" > "$B/register"
          cat "$B/qemu-aarch64"

  flatpak-arm64:
    needs: qemu
    runs-on: docker
    timeout-minutes: 300
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: FLATPAK_IN_CONTAINER=1 FLATPAK_ARCH=aarch64 packaging/flatpak/build.sh
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: flatpak-arm64
          path: dist/*.flatpak

  appimage-arm64:
    needs: qemu
    runs-on: docker
    timeout-minutes: 300
    container:
      # The arm64-only repository: the runner's daemon keeps a single-arch
      # copy of library/debian:trixie (amd64), so --platform can't pick arm64.
      image: docker.io/arm64v8/debian:trixie
      options: --platform linux/arm64
    steps:
      - name: System packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git curl ca-certificates nodejs build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev librsvg2-common adwaita-icon-theme file python3 appstream
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: IN_CONTAINER=1 CARGO_TARGET_DIR=target packaging/appimage/build.sh
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: appimage-arm64
          path: dist/*.AppImage

  publish:
    needs: [android, flatpak, appimage, flatpak-arm64, appimage-arm64]
    runs-on: docker
    # Room to wait for the GitHub builds (two hours at most, below).
    timeout-minutes: 180
    container:
      image: docker.io/library/debian:trixie
    steps:
      - name: System packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git curl ca-certificates nodejs python3 gnupg unzip
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the builds
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.apks' -o -name '*.flatpak' -o -name '*.AppImage' -o -name '*-setup.exe' \) -exec cp {} release/ \;
      # macOS and Windows, from the GitHub mirror's runs for this tag. Usually
      # done by now; it waits up to two hours, then publishes without them.
      - name: GitHub builds
        continue-on-error: true
        env:
          GITHUB_REPO: alvaroemtnez/HFPredict
          GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          GITHUB_WAIT_MINUTES: "120"
        run: tools/fetch-github-builds.sh "${GITHUB_REF_NAME}" release
      - name: Checksums and signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            export GNUPGHOME="$(mktemp -d)"
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output release/SHA256SUMS.asc release/SHA256SUMS
            rm -rf "$GNUPGHOME"
          fi
      - name: Publish
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GITHUB_REPO: alvaroemtnez/HFPredict
          GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: tools/publish-release.sh "${GITHUB_REF_NAME}" release
