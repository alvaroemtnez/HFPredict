[package]
name = "hfpredict"
description = "HF propagation forecasts for amateur radio, for GNOME"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hfpredict-core = { path = "../core" }
# GTK 4.18 and libadwaita 1.7 are the oldest supported: Debian 13's, and what
# the AppImage bundles. The Flatpak runs on a newer GNOME runtime.
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
serde_json = "1"
futures-util = "0.3"

# "Use my location": the location portal (GeoClue behind it) on Linux and
# other Unix desktops, the system's own location service on Windows and on
# macOS (src/location.rs).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "location"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Geolocation", "Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
futures-channel = "0.3.34"
objc2 = "0.6.5"
objc2-core-location = { version = "0.3.2", default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate", "CLError"] }
objc2-foundation = "0.3.2"
