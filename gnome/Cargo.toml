[package]
name = "hfpredict"
description = "HF propagation forecasts for amateur radio, for GNOME"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hfpredict-core = { path = "../core" }
# GTK 4.18 and libadwaita 1.7 are the oldest supported: Debian 13's, and what
# the AppImage bundles. The Flatpak runs on a newer GNOME runtime.
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
# The location portal (GeoClue behind it), for "Use my location".
ashpd = { version = "0.13", default-features = false, features = ["async-io", "location"] }
serde_json = "1"
futures-util = "0.3"
