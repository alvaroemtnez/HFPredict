[package]
name = "hfpredict-core"
description = "HFPredict's shared logic: forecasts, coverage maps, places and the map renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["net"]
# The three optional online sources (NOAA, GIRO, Open-Meteo). Off, the core
# has no networking code at all.
net = ["dep:ureq"]
# Updates for the desktop builds that update themselves (Windows, macOS):
# the release check, the download, its checksum and the release key's
# signature on SHA256SUMS. Only the desktop app turns it on.
update = ["net", "dep:sha2", "dep:ed25519-dalek"]
# UniFFI derives, for the Android bindings (crate `hfpredict-ffi`).
ffi = ["dep:uniffi"]

[dependencies]
hfcast.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
unicode-normalization = "0.1"
ureq = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }
ed25519-dalek = { version = "2", optional = true }
uniffi = { workspace = true, optional = true }
thiserror = "2"
# Local time at a place: the zone from its coordinates (boundaries from
# timezone-boundary-builder, OpenStreetMap data, ODbL) and the zone's rules
# from a bundled tz database, so no system files are needed.
tzf-rs = { version = "2", default-features = false, features = ["bundled"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

[dev-dependencies]
tiny-skia = { version = "0.12", features = ["png-format"] }
